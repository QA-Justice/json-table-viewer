<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON → Table Viewer</title>
    <meta name="description" content="A web application that converts JSON data into a table.">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="style-improved.css?v=studioblank-4l">
    <link rel="icon" type="image/png" href="./favicon-star.png">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="zoom-control" title="Zoom (Ctrl + = / - / 0, Ctrl + wheel)">
        <button id="zoomOutBtn" class="zoom-btn" aria-label="Zoom out">−</button>
        <button id="zoomValue" class="zoom-value" title="Reset to 100%">100%</button>
        <button id="zoomInBtn" class="zoom-btn" aria-label="Zoom in">+</button>
      </div>
      <h1>JSON → Table Viewer</h1>
      <p class="subtitle">Paste JSON. Read it as a table.</p>
    </header>

    <!-- Input Section -->
    <div class="input-section">
      <div class="textarea-container">
        <div class="editor-actions">
          <button id="pasteBtn" class="reset-btn" title="Paste JSON from clipboard">📋 Paste</button>
          <button id="resetBtn" class="reset-btn" title="Reset to sample JSON">↺ Reset</button>
        </div>
        <div class="editor">
          <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
          <textarea
            id="jsonInput"
            placeholder="Paste your JSON data here."
            rows="12"
            spellcheck="false"
            wrap="off"
            autofocus
          ></textarea>
        </div>
        <p id="focusHint" class="focus-hint" hidden>Click here first, then Ctrl+V — or use 📋 Paste.</p>
      </div>
      <div class="button-container">
        <input type="file" id="jsonFileInput" accept=".json,application/json" style="display:none;" />
        <button id="fileUploadBtn" class="main-btn">📁 Upload</button>
        <button id="convertBtn" class="main-btn">✨Convert</button>
        <button id="downloadExcelBtn" class="main-btn">📥 CSV</button>
        <div class="dropdown-container">
          <button id="copyToClipboardBtn" class="main-btn dropdown-trigger">📋 Copy ▼</button>
          <div id="copyOptions" class="dropdown-menu">
            <button class="dropdown-item" data-format="markdown">Markdown</button>
            <button class="dropdown-item" data-format="text">Text</button>
          </div>
        </div>
        <button id="pivotBtn" class="main-btn">🔄 Pivot</button>
        <div class="keyboard-hint">
          You can press Ctrl + F to search
        </div>
      </div>
    </div>

     <!-- Result Section -->
    <section class="result-section">
      <div id="tableContainer">
        <div class="no-data-message">
          <p>📭 No data to display.</p>
          <p>Please paste JSON into the input area above.</p>
        </div>
      </div>
    </section>
  </div>
  <div class="donate-container">
    <a href="https://www.buymeacoffee.com/justice_tia" target="_blank" class="donate-btn">
    ☕ Buy me a coffee 😋
   </a>
  </div>
  </div>
  <!-- Script -->
  <script type="module" src="script-improved.js"></script>
  <script src="search-content.js"></script>
</body>
</html>
